[project]
name = "base-project"
version = "0.1.0"
description = "Reusable FastAPI and Vue 3 application template"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.136.1",
    "psycopg2-binary>=2.9.12",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.29",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.47.0",
    "loguru>=0.7.3",
]

[dependency-groups]
dev = ["httpx>=0.28.1", "pytest>=9.0.0", "pytest-asyncio>=1.3.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
